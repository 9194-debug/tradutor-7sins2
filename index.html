<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Tradutor de Arquivo de Tradução</title>
  <style>
    body { font-family: sans-serif; margin: 20px; background-color: #f4f4f9; color: #333; }
    textarea { width: 100%; height: 250px; font-family: monospace; font-size: 13px; margin-bottom: 10px; }
    button { padding: 10px 20px; font-size: 15px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
    button:disabled { background: #ccc; }
    .status { margin-top: 10px; font-weight: bold; }
  </style>
</head>
<body>

  <h2>Tradutor de Arquivos de Diálogos e Ações</h2>
  <p>Cole o conteúdo do seu arquivo abaixo e clique em <b>Traduzir</b>:</p>

  <textarea id="input" placeholder="Cole o conteúdo do seu arquivo aqui..."></textarea><br>
  <button id="btnTranslate" onclick="processFile()">Traduzir para Português</button>
  <div class="status" id="status"></div>

  <h3>Resultado:</h3>
  <textarea id="output" readonly placeholder="O arquivo traduzido aparecerá aqui..."></textarea>

  <script>
    // Função auxiliar para dar uma pausa milimétrica e evitar bloqueios
    const sleep = ms => new Promise(res => setTimeout(res, ms));

    // CORRIGIDO: Agora usa a API estável MyMemory, livre de bloqueios de IP (429) e erros de CORS
    async function translateText(text, targetLang = 'pt') {
      if (!text.trim()) return text;
      try {
        const url = `https://translated.net{encodeURIComponent(text)}&langpair=en|${targetLang}`;
        const res = await fetch(url);
        
        if (!res.ok) return text;
        
        const data = await res.json();
        if (data && data.responseData && data.responseData.translatedText) {
          return data.responseData.translatedText;
        }
        return text;
      } catch (err) {
        console.error('Erro ao traduzir:', text, err);
        return text; 
      }
    }

    async function processFile() {
      const input = document.getElementById('input').value;
      const btn = document.getElementById('btnTranslate');
      const status = document.getElementById('status');
      const output = document.getElementById('output');

      if (!input.trim()) {
        alert('Por favor, insira o conteúdo do arquivo.');
        return;
      }

      btn.disabled = true;
      status.innerText = 'Processando e traduzindo linhas... Por favor, aguarde.';
      
      const lines = input.split('\n');
      const translatedLines = [];

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i];

        // Se for linha de comentário ou cabeçalho técnico solto
        if (line.trim().startsWith('#') && !line.includes(' ')) {
          translatedLines.push(line);
          continue;
        }

        // Caso 1: Conteúdo dentro de aspas (Exemplo: "Already said!")
        if (line.includes('"')) {
          const regex = /"([^"]+)"/g;
          let matches = [...line.matchAll(regex)];
          
          for (let match of matches) {
            const originalText = match[1];
            const translatedText = await translateText(originalText, 'pt');
            line = line.replace(`"${originalText}"`, `"${translatedText}"`);
            await sleep(150); // Pequena pausa técnica de estabilidade
          }
          translatedLines.push(line);
        }
        // Caso 2: Linhas após #FIELD_ID que contêm textos soltos sem aspas
        else if (!line.trim().startsWith('#') && line.trim().length > 0) {
          const translatedText = await translateText(line.trim(), 'pt');
          const leadingSpaces = line.match(/^\s*/)[0];
          translatedLines.push(leadingSpaces + translatedText);
          await sleep(150); // Pequena pausa técnica de estabilidade
        } 
        else {
          translatedLines.push(line);
        }

        // Atualiza o status em tempo real linha por linha para você ver o progresso
        status.innerText = `Traduzindo linha ${i + 1} de ${lines.length}...`;
      }

      output.value = translatedLines.join('\n');
      status.innerText = 'Tradução concluída com sucesso!';
      btn.disabled = false;
    }
  </script>

</body>
</html>
